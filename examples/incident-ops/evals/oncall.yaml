context: Production reliability and on-call engineering wiki for Kestrel Pay SREs, read by an on-call engineer or agent at 3 a.m.
questions:
  - id: checkout-tuesday-restarts
    group: services
    ask: Why does Checkout Worker restart every Tuesday around 03:00 UTC, and did rolling back Go 1.24.2 fix it?
    find: Checkout Worker
    expect:
      article: services/checkout-worker
      holds: [reconcile-sweep, CHECKOUT_POOL_WATCHDOG_MS, "1800", OPS-412]
      judge: The answer ties the recurring Tuesday 03:00 UTC latency spike and pod restarts to the May 2026 INC-141 workaround (reconcile-sweep saturating pg-read-replica-pool plus CHECKOUT_POOL_WATCHDOG_MS=1800), notes that rolling back Go 1.24.2 did not stop the restarts, and names OPS-412.
  - id: webhook-slo-breach
    group: services
    ask: Which service is out of SLO budget right now, what percentage of budget has it consumed, and what incidents caused it?
    find: Webhook Dispatcher
    expect:
      article: services/webhook-dispatcher
      holds: ["118.4", INC-204, INC-211]
      fields:
        slo_status: breached
        oncall_risk: high
      judge: The answer identifies Webhook Dispatcher as breached at 118.4% error-budget consumption and attributes the burn to INC-204 and INC-211.
  - id: inc-204-corrected-drops
    group: incidents
    ask: How many merchant webhooks were actually dropped during INC-204?
    find: INC-204
    expect:
      article: incidents/inc-204-redis-failover-storm
      holds: ["4,210"]
      judge: The answer states that 4,210 merchant webhooks were actually dropped during INC-204, superseding the initial preliminary estimate of 18,400.
  - id: inc-204-redis-decision-and-date
    group: incidents
    ask: What did the team decide about Redis maxclients after INC-204, and when is the 3-AZ Sentinel migration now scheduled?
    find: INC-204
    expect:
      article: incidents/inc-204-redis-failover-storm
      holds: ["4,000", "2026-12-04"]
      judge: The answer states that Elena Rossi decided to keep Redis maxclients capped at 4,000 (rejecting Tomasz Kowalski's 10,000 proposal) and that the 3-AZ Sentinel migration slipped from 2026-11-20 to 2026-12-04 because of a stale 300-second DNS TTL on redis-primary.internal.
  - id: webhook-timeout-threshold
    group: runbooks
    ask: What are the current per-merchant outbound HTTP timeout and circuit-breaker thresholds on Webhook Dispatcher?
    find: Webhook Dispatcher
    expect:
      article: services/webhook-dispatcher
      holds: ["5 seconds", "40%"]
      judge: The answer states that the per-merchant outbound HTTP timeout was lowered from 15 seconds to 5 seconds and the per-merchant circuit breaker trips at 40% 5xx or timeout rate over 2 minutes.
  - id: weekly-brief-breach-and-flap
    group: digests
    ask: What does the Weekly Reliability Brief say about breached services and recurring flap signatures?
    read: [digests/weekly-reliability-brief]
    expect:
      article: digests/weekly-reliability-brief
      holds: [Webhook Dispatcher, Checkout Worker, "118.4"]
      judge: The answer flags Webhook Dispatcher as breached at 118.4% budget consumed and highlights Checkout Worker's recurring Tuesday 03:00 UTC flap signature.
