note: 'Cases on how the presumed mark is read, run by checks/presumed_eval.py --cases checks/presumed_mark_cases.yaml:
  a mark names one key exactly as written (fx01, fx02), a list of several keys goes (fx03, fx04), presumed: true names the
  one value that could be a guess or buys nothing (fx05 to fx08), and two marks spelled the same go (fx09). Every case was
  labelled by hand before anything ran against it, and no case is edited once run. supported-in-other-words: the item should
  land; truly-unsupported: it should go.'
