note: >-
  The presumed cases on the same facts, with each presumed item naming its presumed value by key, as presumed: role, run by checks/presumed_eval.py --cases checks/presumed_named_cases.yaml. Every case was labelled by hand before anything ran against it, and no case is edited once run. supported-in-other-words: the item should land; truly-unsupported: it should go. An item that names its presumed value should land when its cited facts hold every other value and name each person or thing it names, and go when it names one no fact names, gives a date or figure no fact gives (a guessed date or figure included), cites nothing, names a key it lacks or every key, or cites a fact that states a different value in place of the presumed one. The plain cases pu01 to pu06 are those of checks/presumed_cases.yaml, unchanged.
