      Date: 2026-11-07

      Grace Liu, director of IT at Novaline Health, kicked off the rollout to their three clinics.

      The first clinic, in Tacoma, goes live on 2 December. Grace Liu asked for weekly status calls on Tuesdays.

      Lina Brooks from our side runs the rollout.
