note: 'Forty items whose mark names one guess, half a fair reading of the part the item''s subject plays and half a fact
  dressed as a guess, in a theatre company, a water utility and a school, none of them sales. Run by checks/presumed_eval.py
  --cases checks/presumed_reading_cases.yaml. Every case was labelled by hand before anything ran against it, and no case
  is edited once run: a label found wrong is reported, not changed. supported-in-other-words: the item should land; truly-unsupported:
  it should go. A guess should land when it only reads the part its subject plays, as who decides, who owns or what part
  someone takes, and every other value is in its cited fact. It should go when it states an event, a cause, a condition,
  a state of some other thing, or a name, date or count no cited fact gives. Every person, company, utility and school is
  invented.'
