note: >-
  Items of a data block its writer marks presumed, and plain items beside them, for an eval of grounding on the real
  decision model: run by checks/presumed_eval.py. Every case was labelled by hand before anything ran against it, and
  no case is edited once run: a label found wrong is reported, not changed. supported-in-other-words: the item should
  land; truly-unsupported: it should go. A presumed item should land when its cited facts name each person or thing it
  names and give each date or figure it gives, though no fact states the presumed value, and go when it names one no
  fact names, gives a date no fact gives, cites nothing, or cites a fact that states a different value. A plain item
  whose value no fact states should go. Every person, firm, lab, clinic and repository is invented, and none is in the
  grounding corpus or the gtm check's notes.
