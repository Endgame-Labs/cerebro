<text x="24" y="28" font-size="15" font-weight="600" fill="#f0efec">Cerebro is the stack. Factoid is its facts layer.</text>
<text x="56" y="72" font-size="13" font-weight="600" fill="#f0efec">Outside agents</text>
<text x="56" y="88" font-size="11.5" fill="#c3c2b8">Claude, Cursor, or Codex, over MCP</text>
<text x="520" y="80" font-size="13" font-weight="600" fill="#f0efec">You</text>
<text x="56" y="220" font-size="13" font-weight="600" fill="#f0efec">MCP surface</text>
<text x="56" y="236" font-size="11.5" fill="#c3c2b8">Six tools over every kind</text>
<text x="288" y="220" font-size="13" font-weight="600" fill="#f0efec">Human input</text>
<text x="288" y="236" font-size="11.5" fill="#c3c2b8">tell, decide, retract, review</text>
<text x="520" y="220" font-size="13" font-weight="600" fill="#f0efec">CLI</text>
<text x="520" y="236" font-size="11.5" fill="#c3c2b8">Run Cerebro from a terminal</text>
<text x="56" y="292" font-size="13" font-weight="600" fill="#f0efec">Model calls and budget</text>
<text x="56" y="308" font-size="11.5" fill="#c3c2b8">A cap for each layer</text>
<text x="288" y="292" font-size="13" font-weight="600" fill="#f0efec">Store</text>
<text x="288" y="308" font-size="11.5" fill="#c3c2b8">SQLite to start, hooks for more</text>
<text x="520" y="292" font-size="13" font-weight="600" fill="#f0efec">Search</text>
<text x="520" y="308" font-size="11.5" fill="#c3c2b8">BM25, re-ranked if set</text>
<text x="56" y="186" font-size="13" font-weight="600" fill="#f0efec">Core</text>
<text x="72" y="412" font-size="13" font-weight="600" fill="#f0efec">Facts</text>
<text x="72" y="428" font-size="11.5" fill="#c3c2b8">by Factoid</text>
<text x="72" y="444" font-size="11.5" fill="#c3c2b8">(also stands alone)</text>
<text x="432" y="412" font-size="13" font-weight="600" fill="#f0efec">Articles</text>
<text x="432" y="428" font-size="11.5" fill="#c3c2b8">by context agents</text>
<text x="432" y="444" font-size="11.5" fill="#c3c2b8">Curators admit them</text>
<text x="56" y="378" font-size="13" font-weight="600" fill="#f0efec">Context layer</text>
<text x="56" y="540" font-size="13" font-weight="600" fill="#f0efec">Connectors</text>
<text x="56" y="556" font-size="11.5" fill="#c3c2b8">Core: hold the logins</text>
<text x="288" y="540" font-size="13" font-weight="600" fill="#f0efec">Apps: Notes</text>
<text x="288" y="556" font-size="11.5" fill="#c3c2b8">Yours to add</text>
<text x="176" y="150" font-size="13" font-weight="600" fill="#f0efec">Cerebro: a wiki your agents write</text>
<text x="40" y="648" font-size="13" fill="#f0efec">Your systems: CRM, call recorder, mailbox, folders</text>
<text x="380" y="413" font-size="11.5" fill="#c3c2b8" text-anchor="middle">evidence</text>
<text x="156" y="492" font-size="11.5" fill="#c3c2b8">documents</text>
<text x="304" y="492" font-size="11.5" fill="#c3c2b8" text-anchor="end">documents</text>
<text x="510" y="492" font-size="11.5" fill="#c3c2b8">direct evidence</text>
<text x="156" y="616" font-size="11.5" fill="#c3c2b8">read only</text>
</svg>
