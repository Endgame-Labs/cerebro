<path d="M140 420 L136.25 412.5 L143.75 412.5Z" fill="#b4bcc5"/>
<path d="M620 380 L620 412.5" fill="none" stroke="#b4bcc5" stroke-width="1.25"/>
<path d="M620 420 L616.25 412.5 L623.75 412.5Z" fill="#b4bcc5"/>
