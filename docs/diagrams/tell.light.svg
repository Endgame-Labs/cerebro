<text x="24" y="28" font-size="15" font-weight="600" fill="#1f2328">What you tell is kept whole, then becomes facts or a proposal citing it.</text>
<text x="296" y="72" font-size="13" font-weight="600" fill="#1f2328">A person</text>
<text x="296" y="88" font-size="11.5" fill="#59636e">tell { text, target }</text>
<text x="296" y="204" font-size="13" font-weight="600" fill="#1f2328">A first-party record</text>
<text x="296" y="220" font-size="11.5" fill="#59636e">kept whole: it has</text>
<text x="296" y="236" font-size="11.5" fill="#59636e">no other copy</text>
<text x="56" y="324" font-size="13" font-weight="600" fill="#1f2328">Facts</text>
<text x="56" y="340" font-size="11.5" fill="#59636e">drawn by Factoid from</text>
<text x="56" y="356" font-size="11.5" fill="#59636e">the record, citing it</text>
<text x="536" y="316" font-size="13" font-weight="600" fill="#1f2328">A proposal</text>
<text x="536" y="332" font-size="11.5" fill="#59636e">citing the record: an</text>
<text x="536" y="348" font-size="11.5" fill="#59636e">instruction applies now,</text>
<text x="536" y="364" font-size="11.5" fill="#59636e">a sorted admit waits</text>
<text x="56" y="444" font-size="13" font-weight="600" fill="#1f2328">The agent's next run</text>
<text x="56" y="460" font-size="11.5" fill="#59636e">reads the new facts as evidence, and the proposals left for it</text>
<text x="56" y="540" font-size="13" font-weight="600" fill="#1f2328">The article</text>
<text x="56" y="556" font-size="11.5" fill="#59636e">its text: only a run writes it</text>
<text x="56" y="572" font-size="11.5" fill="#59636e">its front matter: its curator at an admit, and its agents</text>
<text x="40" y="166" font-size="13" font-weight="600" fill="#1f2328">Cerebro</text>
<text x="210" y="205" font-size="11.5" fill="#59636e" text-anchor="middle">what it states</text>
<text x="550" y="205" font-size="11.5" fill="#59636e" text-anchor="middle">what it asks</text>
<text x="388" y="500" font-size="11.5" fill="#59636e">writes its text and fields</text>
</svg>
