<svg xmlns="http://www.w3.org/2000/svg" width="760" height="628" viewBox="0 0 760 628" role="img" aria-labelledby="tell-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="tell-title">What you tell is kept whole, then becomes facts or a proposal citing it.</title>
<rect width="760" height="628" fill="#ffffff"/>
<rect x="24" y="144" width="712" height="460" rx="8" fill="#f5f8fe" stroke="#2f6fdb" stroke-width="2"/>
